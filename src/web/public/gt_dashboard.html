<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrowTurk - GrowID Login</title>
<style>
  body { background: linear-gradient(135deg,#0e1320,#15192b); color: #e8ecf5; font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { background: #1c2238; border: 1px solid #2c3556; padding: 28px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  h1 { margin: 0 0 4px; background: linear-gradient(90deg,#6cd0ff,#b58cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { color: #99a2c1; margin-top: 0; }
  form { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  input { background: #232a47; color: #e8ecf5; border: 1px solid #2c3556; border-radius: 6px; padding: 11px; font-size: 14px; }
  input:focus { outline: 1px solid #6cd0ff; }
  button { background: linear-gradient(90deg,#6cd0ff,#b58cff); border: none; color: #051018; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .msg { margin-top: 10px; min-height: 18px; font-size: 13px; }
  .err { color: #ff7c8a; } .ok { color: #6cf09a; }
  small { color: #99a2c1; }
</style>
</head><body>
<div class="card">
  <h1>GrowTurk</h1>
  <p class="sub">Hesabina giris yap.</p>
  <form id="f" autocomplete="on">
    <input id="growID" name="growID" placeholder="GrowID" required minlength="3" maxlength="20" autocomplete="username">
    <input id="password" name="password" type="password" placeholder="Sifre" required minlength="4" autocomplete="current-password">
    <button>Giris</button>
  </form>
  <div id="msg" class="msg"></div>
  <small>Hesabin yoksa direkt giris yaparsan otomatik olusturulur.</small>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = 'Dogrulaniyor...';
  const fd = new FormData(e.target);
  const r = await fetch('/player/login/validate', { method: 'POST', body: new URLSearchParams(fd) }).then(x => x.json()).catch(() => ({ status: 'error', message: 'baglanti' }));
  if (r.status !== 'success') { msg.className = 'msg err'; msg.textContent = r.message || 'Hata'; return; }
  msg.className = 'msg ok';
  msg.textContent = 'Basarili! Oyuna donulebilir. Token: ' + r.token.slice(0, 8) + '...';
  // GT istemcisi bu yaniti yakaliyor ve oyuncuya kapaniyor.
});
</script>
</body></html>
