name: Deploy İzyap site to GitHub Pages

on:
  push:
    branches:
      - claude/izyap-company-website-fCEFk
      - main
    paths:
      - 'izyap-website/**'
      - '.github/workflows/deploy-izyap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./izyap-website
      - id: deployment
        uses: actions/deploy-pages@v4
