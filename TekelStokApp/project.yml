name: TekelStok
options:
  bundleIdPrefix: com.tekelstok
  deploymentTarget:
    iOS: "17.0"
targets:
  TekelStok:
    type: application
    platform: iOS
    sources:
      - TekelStok
    info:
      path: TekelStok/Info.plist
      properties:
        CFBundleDisplayName: Tekel Stok
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Ürün barkodlarını okumak için kamera erişimi gereklidir."
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
